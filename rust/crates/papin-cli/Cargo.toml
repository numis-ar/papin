[package]
name = "papin-cli"
version = "0.1.0"
edition = "2021"
description = "Terminal client for papin-gateway: ratatui TUI over acp-wire"

[dependencies]
acp-wire = { path = "../acp-wire" }
tokio = { workspace = true }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
clap = { version = "4", features = ["derive"] }
ratatui = "0.29"
crossterm = { version = "0.28", features = ["event-stream"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
toml = "0.8"

[dev-dependencies]
integration-tests = { path = "../../tests/integration-tests" }
papin-gateway = { path = "../papin-gateway" }
tempfile = "3"

[[bin]]
name = "papin"
path = "src/main.rs"
