[workspace]
resolver = "2"
members = [
    "crates/acp-wire",
    "crates/papin-gateway",
    "crates/papin-acp-enter",
    "crates/papin-enroll-helper",
    "crates/papin-cli",
    "tests/integration-tests",
]

[workspace.dependencies]
tokio = { version = "1", features = [
    "macros",
    "rt-multi-thread",
    "time",
    "sync",
    "io-util",
    "process",
    "net",
    "fs",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
async-trait = "0.1"
